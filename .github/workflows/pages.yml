name: Publish to gh-pages

# Pages serves this repo from the gh-pages branch, so a push to main copies
# the site across. Editing index.html on main is all it takes to ship.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy the site onto gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout main -- index.html README.md LICENSE
          touch .nojekyll
          git add -A
          git diff --cached --quiet && echo "Nothing to publish" && exit 0
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push origin gh-pages
